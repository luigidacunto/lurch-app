<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#C8102E">
    <title>Lurch — Nessuna connessione</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f9fafb;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .icon {
            width: 72px; height: 72px;
            background: #fee2e2;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
        }
        .icon svg { width: 36px; height: 36px; color: #C8102E; }
        h1 {
            font-size: 20px; font-weight: 800; color: #111827;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px; color: #6b7280; line-height: 1.6;
            max-width: 280px; margin: 0 auto 28px;
        }
        .btn {
            display: inline-block;
            background: #C8102E; color: #fff;
            border: none; border-radius: 10px;
            padding: 13px 28px; font-size: 15px; font-weight: 700;
            cursor: pointer; text-decoration: none;
        }
        .btn:active { background: #a30d25; }
        .logo {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-weight: 800; color: #C8102E; letter-spacing: -0.3px;
        }
    </style>
</head>
<body>
    <div class="logo">Lurch</div>

    <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M1 1l22 22-1.41 1.41-3.5-3.5A10.98 10.98 0 0 1 12 23C6.48 23 2 18.52 2 13c0-2.74 1.07-5.24 2.82-7.09L1 2.41 1 1zM12 5c3.87 0 7 3.13 7 7 0 1.28-.36 2.48-.97 3.51l-1.46-1.46c.28-.63.43-1.32.43-2.05 0-2.76-2.24-5-5-5-.73 0-1.42.15-2.05.43L8.49 5.97A6.94 6.94 0 0 1 12 5zm0 2c.36 0 .71.04 1.05.1l-7 7A5.02 5.02 0 0 1 7 12c0-2.76 2.24-5 5-5z"/>
        </svg>
    </div>

    <h1>Nessuna connessione</h1>
    <p>Non riesco a raggiungere il server. Controlla la connessione e riprova.</p>

    <button class="btn" onclick="window.location.reload()">Riprova</button>
</body>
</html>
